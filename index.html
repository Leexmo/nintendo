<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Super Mario World</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #game {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!-- O contêiner onde o jogo vai rodar em tela cheia -->
    <div id="game"></div>

    <script type="text/javascript">
        // Configurações do emulador
        EJS_player = '#game';
        EJS_core = 'snes'; // Define o Super Nintendo
        
        // Caminho do sistema oficial sem anúncios
        EJS_pathtodata = 'https://emulatorjs.org';
        
        // Link direto da ROM do Super Mario World
        // Nota: Substitua pelo link direto do seu arquivo .sfc ou .smc se preferir
        EJS_gameUrl = 'https://githubusercontent.com'; 
    </script>
    
    <!-- Carrega o script inicializador -->
    <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
