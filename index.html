<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Super Mario World</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #game {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="game"></div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'snes';
        
        // Desativa explicitamente telas de propaganda internas
        EJS_AdTimer = -1; 
        
        // Servidor de dados alternativo livre de bloqueios
        EJS_pathtodata = 'https://githack.com';
        
        // ROM estável hospedada publicamente
        EJS_gameUrl = 'https://archive.org';
    </script>
    
    <script src="https://githack.comloader.js"></script>

</body>
</html>
